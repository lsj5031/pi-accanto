name: Build and fixture tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:fixtures
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fixture-failure-evidence
          path: test-results/
          retention-days: 7
