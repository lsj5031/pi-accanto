name: Build and fixture tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run package
      - name: Build and validate unsigned Firefox package (no browser qualification)
        run: |
          npm run package:firefox
          npm run test:firefox:distribution
      - run: npm run test:distribution
      - run: npm run test:release
      - run: npm run test:permissions
      - run: npm run test:panel-state
      - run: npm run test:identity
      - run: npm run test:browser-target
      - name: Run complete fixtures, including attachments
        run: npm run test:fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: extension-download
          path: |
            artifacts/pi-accanto-*.zip
            !artifacts/pi-accanto-*-firefox.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-unsigned-download
          path: artifacts/pi-accanto-*-firefox.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fixture-failure-evidence
          path: test-results/
          retention-days: 7
